[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
ensure_newline_before_comments = true
line_length = 120
skip = "migrations"
atomic = true

[tool.black]
exclude = '/(git|venv|.volumes|migrations)/'
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]
exclude = [
    ".git",
    ".volumes",
    "migrations",
    "__pycache__"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "r_taaw_backend.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra -q --color=yes"
